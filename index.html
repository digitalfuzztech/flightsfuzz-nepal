<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/flightsfuzz-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090909" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="FlightsFuzz is a demonstration flight-booking request platform for travellers from Nepal. Search routes, review demo flights and prepare a human-assisted request."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="FlightsFuzz — Flight Booking Requests from Nepal" />
    <meta
      property="og:description"
      content="Search routes, review demonstration flight options and send a structured booking request for human follow-up."
    />
    <meta property="og:type" content="website" />
    <title>FlightsFuzz — Flight Booking Requests from Nepal</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('flightsfuzz-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.classList.add('is-preloading')
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
